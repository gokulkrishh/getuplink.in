# Fallback poller for the Vercel Hobby plan, where crons can run at most once a day.
# To use it: copy to .github/workflows/poll.yml, add CRON_SECRET as a repository
# secret, uncomment `schedule`, and remove the "crons" block from vercel.json
name: Poll vehicles

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron endpoint
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://tesla-in-updates.vercel.app/api/cron/poll
