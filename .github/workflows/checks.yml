# Typecheck, tests and a production build on every push to main and every pull request, so a change that
# breaks one is flagged even when a local check was skipped. Vercel deploys main on its own; this is the
# record that the commit passed.
#
# Two jobs side by side, so the run takes about as long as the build alone: types and tests in one, the
# build in the other.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Next writes the route types tsc reads (PageProps, LayoutProps).
      - run: bunx next typegen
      - run: bunx tsc --noEmit -p .
      # One process per test file: mock.module stubs leak between files in one process (scripts/test-each.ts).
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # No secrets here: the build runs without them, as it does for a fresh checkout.
      - run: bun run build
