# Deploys the Fleet Telemetry receiver (fly/telemetry) to Fly.io when a push to main changes it.
# App-only pushes don't touch the receiver, so the car's stream isn't restarted for nothing.
# Needs the repo secret FLY_API_TOKEN: a deploy token scoped to the app
# (flyctl tokens create deploy -a uplink-telemetry).
name: Deploy telemetry receiver

on:
  push:
    branches: [main]
    paths: ["fly/telemetry/**"]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: fly-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: fly/telemetry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
