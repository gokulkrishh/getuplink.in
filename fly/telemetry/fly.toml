# Fleet Telemetry receiver. Deploys itself on a push to main that changes this folder
# (.github/workflows/deploy-telemetry.yml); by hand: cd fly/telemetry && fly deploy
# Secrets (never in this file): TLS_SERVER_CERT, TLS_SERVER_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
app = "uplink-telemetry"
primary_region = "sin"
# Give the worker time to flush buffered readings on deploy/stop.
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

# Raw TCP passthrough on purpose: no [services.ports.handlers], so TLS (and the car's client
# certificate) reach fleet-telemetry untouched. Adding "tls" or "http" handlers would break mTLS.
[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443

  # A plain TCP connect, so a deploy whose receiver never starts listening fails instead of passing.
  # It opens and closes the socket without TLS, which fleet-telemetry may log as a handshake EOF.
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
